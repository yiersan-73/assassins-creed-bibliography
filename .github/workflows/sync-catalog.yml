name: Sync Open Zotero Catalog

on:
  schedule:
    # Weekly sync every Monday at 03:00 UTC (11:00 UTC+8)
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        run: python -m pip install --no-cache-dir requests

      - name: Export public Zotero group snapshot (CC0 / CC BY 4.0)
        run: python export_catalog.py --group-id 6777746 --skip-if-unchanged

      - name: Commit updated catalog if changed
        run: |
          if git diff --quiet -- data/ docs/data/catalog.json; then
            echo "Catalog is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bibliography.json data/bibliography.csv docs/data/catalog.json
          git commit -m "chore(catalog): sync public Zotero group snapshot"
          git push
